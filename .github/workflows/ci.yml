name: CI

on:
  push:
    branches: [ main, 0.1.0 ]
  pull_request:
    branches: [ main, 0.1.0 ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-homeassistant-custom-component
      - name: Run tests
        run: |
          pytest